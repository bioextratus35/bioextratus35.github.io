<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Compilar alvo MindAR</title>
<style>body{font-family:sans-serif;background:#222;color:#eee;padding:16px} canvas{max-width:45vw;border:1px solid #555;margin:4px}</style>
</head>
<body>
<h3>Compilando ../site/assets/alvo_quadro.png → site/targets/quadro.mind</h3>
<p id="status">carregando…</p>
<div id="saida"></div>
<script type="module">
import { Compiler } from '/vendor/mindar-image.prod.js';
const status = document.getElementById('status');
const img = new Image();
img.src = '/assets/alvo_quadro.png';
await img.decode();
const compiler = new Compiler();
const t0 = performance.now();
const data = await compiler.compileImageTargets([img], (p) => { status.textContent = 'progresso ' + p.toFixed(1) + '%'; });
const buf = await compiler.exportData();
await fetch('/__save?name=quadro.mind', { method: 'POST', body: buf });

// Desenha os pontos de característica (matching) de cada escala, para conferir a cobertura
const d = data[0];
let total = 0;
const info = [];
for (const [i, m] of d.matchingData.entries()) {
  const c = document.createElement('canvas');
  c.width = m.width; c.height = m.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, m.width, m.height);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, m.width, m.height);
  const pts = [...m.maximaPoints, ...m.minimaPoints];
  total += pts.length;
  info.push(`escala ${i}: ${m.width}x${m.height}, ${pts.length} pontos`);
  for (const p of pts) { g.fillStyle = '#ff0'; g.beginPath(); g.arc(p.x, p.y, Math.max(1.5, m.width / 250), 0, 7); g.fill(); }
  document.getElementById('saida').appendChild(c);
  if (i === 0) {
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    await fetch('/__save?name=pontos_caracteristica.png', { method: 'POST', body: blob });
  }
}
const tr = d.trackingData.map((t, i) => `tracking ${i}: ${t.width}x${t.height}, ${t.points.length} pontos`);
status.textContent = `PRONTO em ${((performance.now() - t0) / 1000).toFixed(1)} s · ${buf.byteLength} bytes · ` + info.concat(tr).join(' | ');
window.__resultado = status.textContent;
</script>
</body>
</html>
