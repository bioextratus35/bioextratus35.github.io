server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;


  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Fly faz o HTTPS na borda; força HTTPS (câmera só funciona em HTTPS)
  if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

  add_header Permissions-Policy "camera=(self)" always;
  add_header X-Content-Type-Options nosniff always;

  location = /index.html { add_header Cache-Control "no-cache"; add_header Permissions-Policy "camera=(self)" always; }
  location = / { add_header Cache-Control "no-cache"; add_header Permissions-Policy "camera=(self)" always; try_files /index.html =404; }

  # assets versionados via ?v=N → cache longo
  location ~* \.(mp4|mind|js|css|png|jpg|svg)$ {
    add_header Cache-Control "public, max-age=604800";
    add_header Accept-Ranges bytes;
  }

  location = /healthz { return 200 "ok"; }
  error_page 404 /404.html;
}
